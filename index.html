<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>До 22 и 28 августа 2026</title>
</head>
<body>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; }

  :root {
    --ground:   #0B0E13;
    --panel:    #121722;
    --rule:     #212936;
    --rule-lit: #2E3949;
    --text:     #E8E3D9;
    --muted:    #8894A6;
    --faint:    #56606F;
    --accent:   #E0904A;
    --accent-d: #8A5326;

    --f-display: "Bahnschrift", "DIN Alternate", "Segoe UI Variable Display", "Segoe UI", Roboto, sans-serif;
    --f-mono: "Cascadia Mono", Consolas, ui-monospace, "SF Mono", Menlo, monospace;
    --f-text: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;

    color-scheme: dark;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --ground:   #EDEFF2;
      --panel:    #FFFFFF;
      --rule:     #D2D8E0;
      --rule-lit: #B9C2CE;
      --text:     #171B22;
      --muted:    #5C6675;
      --faint:    #949DAA;
      --accent:   #A2551F;
      --accent-d: #E4C4A4;
      color-scheme: light;
    }
  }

  :root[data-theme="light"] {
    --ground:   #EDEFF2;
    --panel:    #FFFFFF;
    --rule:     #D2D8E0;
    --rule-lit: #B9C2CE;
    --text:     #171B22;
    --muted:    #5C6675;
    --faint:    #949DAA;
    --accent:   #A2551F;
    --accent-d: #E4C4A4;
    color-scheme: light;
  }

  :root[data-theme="dark"] {
    --ground:   #0B0E13;
    --panel:    #121722;
    --rule:     #212936;
    --rule-lit: #2E3949;
    --text:     #E8E3D9;
    --muted:    #8894A6;
    --faint:    #56606F;
    --accent:   #E0904A;
    --accent-d: #8A5326;
    color-scheme: dark;
  }

  /* второй трекер держит свой акцент, чтобы два отсчёта не сливались */
  .tracker--cool { --accent: #6FA8D0; --accent-d: #2C4E68; }
  @media (prefers-color-scheme: light) {
    .tracker--cool { --accent: #1F5E85; --accent-d: #BBD4E6; }
  }
  :root[data-theme="light"] .tracker--cool { --accent: #1F5E85; --accent-d: #BBD4E6; }
  :root[data-theme="dark"]  .tracker--cool { --accent: #6FA8D0; --accent-d: #2C4E68; }

  body {
    min-height: 100dvh;
    background: var(--ground);
    color: var(--text);
    font-family: var(--f-text);
    display: grid;
    justify-items: center;
    /* safe: если контент выше экрана — прижимаем к верху, иначе шапку срезало бы */
    align-content: safe center;
    padding: clamp(16px, 4vw, 48px);
    overflow-x: hidden;
  }

  .wrap {
    width: min(1240px, 100%);
    display: flex;
    flex-direction: column;
    gap: clamp(26px, 4.5vw, 44px);
  }

  /* ── шапка страницы ────────────────────────────────────── */
  .head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px 24px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--rule);
  }
  .head__title {
    font-family: var(--f-display);
    font-variation-settings: "wght" 600, "wdth" 87.5;
    font-weight: 600;
    font-size: 0.82rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin: 0;
  }
  .head__target {
    font-family: var(--f-mono);
    font-size: 0.76rem;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .head__target b { color: var(--text); font-weight: 400; }

  /* ── список трекеров ───────────────────────────────────── */
  .trackers {
    display: grid;
    grid-template-columns: 1fr;
    gap: clamp(34px, 6vw, 60px);
  }
  .tracker {
    display: flex;
    flex-direction: column;
    gap: clamp(22px, 4vw, 38px);
  }
  .tracker + .tracker { border-top: 1px solid var(--rule); padding-top: clamp(30px, 5vw, 52px); }

  /* с широкого экрана — два трекера рядом, чтобы страница влезала целиком */
  @media (min-width: 960px) {
    .trackers { grid-template-columns: 1fr 1fr; column-gap: 0; }
    .tracker { padding-right: clamp(24px, 3vw, 40px); }
    .tracker + .tracker {
      border-top: 0;
      padding-top: 0;
      padding-right: 0;
      border-left: 1px solid var(--rule);
      padding-left: clamp(24px, 3vw, 40px);
    }
  }

  .tracker__head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px 24px;
  }
  .tracker__title {
    margin: 0;
    font-family: var(--f-display);
    font-variation-settings: "wght" 600, "wdth" 87.5;
    font-weight: 600;
    font-size: 0.78rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .tracker__target {
    font-family: var(--f-mono);
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .tracker__target b { color: var(--text); font-weight: 400; }

  /* ── переключатель режима ──────────────────────────────── */
  .modes { display: flex; gap: 22px; }
  .mode {
    font-family: var(--f-display);
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--faint);
    padding: 4px 0 6px;
    border-bottom: 1px solid transparent;
    cursor: pointer;
    transition: color .18s ease, border-color .18s ease;
  }
  .mode:hover { color: var(--muted); }
  .mode[aria-pressed="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .mode:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }

  /* ── главный отсчёт ────────────────────────────────────── */
  .readout {
    position: relative;
    display: flex;
    align-items: baseline;
    gap: 0;
    font-family: var(--f-display);
    font-variation-settings: "wght" 300, "wdth" 87.5;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    font-size: clamp(3rem, 13vw, 8.4rem);
    line-height: 0.86;
    letter-spacing: -0.02em;
    margin-top: clamp(4px, 1.5vw, 14px);
  }
  @media (min-width: 960px) {
    .readout { font-size: clamp(2.6rem, 7.4vw, 6.4rem); }
  }
  .readout::before {
    content: "";
    position: absolute;
    /* коробка симметрична относительно центра свечения: left+width/2 и top+height/2 дают 31% / 50% */
    left: 0; top: -110%;
    width: 62%; height: 320%;
    /* closest-side + центр по 50%: градиент гаснет ровно на границах коробки,
       поэтому её край не режет свечение (farthest-corner выходил за коробку и давал ступеньку) */
    background: radial-gradient(ellipse closest-side at 50% 50%,
      color-mix(in srgb, var(--accent) 20%, transparent),
      color-mix(in srgb, var(--accent) 7%, transparent) 48%,
      transparent 100%);
    pointer-events: none;
    z-index: -1;
  }
  .readout__sep { color: var(--muted); }
  .readout__dec {
    display: flex;
    align-items: baseline;
    font-family: var(--f-mono);
    font-size: 0.34em;
    font-weight: 400;
    letter-spacing: 0.01em;
    align-self: flex-end;
    padding-bottom: 0.28em;
  }
  .readout__frac { color: var(--accent); }
  .readout__tail {
    font-size: 0.62em;
    color: var(--faint);
    letter-spacing: 0.02em;
    padding-left: 0.12em;
  }
  .readout__pct {
    font-size: 0.24em;
    color: var(--muted);
    align-self: flex-end;
    padding: 0 0 0.45em 0.5em;
    letter-spacing: 0.06em;
  }
  .caption {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 10px;
    margin: 0;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .caption__next {
    margin-left: auto;
    font-family: var(--f-mono);
    font-variant-numeric: tabular-nums;
    font-size: 0.72rem;
    letter-spacing: 0.03em;
    color: var(--faint);
    white-space: nowrap;
  }
  .caption__next b { font-weight: 400; color: var(--muted); }
  .caption__next .caption__secs { color: var(--accent); }
  .caption .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  /* ── шкала интервала ───────────────────────────────────── */
  .scale {
    position: relative;
    height: 62px;
    border-top: 1px solid var(--rule);
    padding-top: 1px;
  }
  .axis { position: absolute; inset: 0; }
  .axis--lit { clip-path: inset(0 var(--clip-r, 0%) 0 var(--clip-l, 0%)); }
  .tick {
    position: absolute;
    top: 0;
    width: 1px;
    background: var(--rule-lit);
    transform: translateX(-0.5px);
  }
  .tick--minor { height: 7px; }
  .tick--major { height: 17px; background: var(--faint); }
  .axis--lit .tick { background: var(--accent); }
  .axis--lit .tick--minor { background: color-mix(in srgb, var(--accent) 55%, transparent); }
  .tlabel {
    position: absolute;
    top: 24px;
    transform: translateX(-50%);
    font-family: var(--f-mono);
    font-size: 0.66rem;
    letter-spacing: 0.08em;
    color: var(--faint);
    white-space: nowrap;
  }
  .axis--lit .tlabel { color: var(--accent); }

  .needle {
    position: absolute;
    top: -6px; bottom: 8px;
    left: var(--pos, 0%);
    width: 1px;
    background: var(--text);
    transform: translateX(-0.5px);
    z-index: 2;
  }
  .needle::before {
    content: "";
    position: absolute;
    top: -3px; left: -2.5px;
    width: 6px; height: 6px;
    background: var(--text);
    transform: rotate(45deg);
  }
  .needle__flag {
    position: absolute;
    bottom: -2px; left: 7px;
    font-family: var(--f-mono);
    font-size: 0.64rem;
    letter-spacing: 0.1em;
    color: var(--text);
    white-space: nowrap;
  }

  /* ── единицы ───────────────────────────────────────────── */
  .units {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-top: 1px solid var(--rule);
  }
  .unit {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 18px 0 0 16px;
    border-left: 1px solid var(--rule);
  }
  .unit:first-child { padding-left: 0; border-left: 0; }
  .unit__val {
    font-family: var(--f-mono);
    font-variant-numeric: tabular-nums;
    font-size: clamp(1.15rem, 3.4vw, 1.9rem);
    line-height: 1;
  }
  .unit__lbl {
    font-family: var(--f-display);
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ── подвал трекера ────────────────────────────────────── */
  .foot {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 28px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
    font-family: var(--f-mono);
    font-size: 0.68rem;
    letter-spacing: 0.03em;
    color: var(--faint);
  }
  .foot span b { color: var(--muted); font-weight: 400; }

  .tracker.is-over .caption .dot { animation: none; background: var(--muted); }

  @media (max-width: 560px) {
    .units { grid-template-columns: repeat(2, 1fr); }
    .unit:nth-child(3) { padding-left: 0; border-left: 0; }
    .unit:nth-child(n+3) { padding-top: 22px; }
    .needle__flag { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .caption .dot { animation: none; }
    .mode { transition: none; }
  }
</style>

<div class="wrap">
  <header class="head">
    <h1 class="head__title">Трекеры · до 22 и 28 августа</h1>
    <div class="head__target">точка отсчёта — <b>22.07.2026, 00:00</b> · местное время</div>
  </header>

  <div class="trackers" id="trackers"></div>
</div>

<template id="tpl-tracker">
  <section class="tracker">
    <header class="tracker__head">
      <h2 class="tracker__title" data-f="title">—</h2>
      <div class="tracker__target">цель — <b data-f="target">—</b></div>
    </header>

    <div class="modes" role="group" data-f="modes">
      <button class="mode" data-f="m-left" aria-pressed="true">осталось</button>
      <button class="mode" data-f="m-gone" aria-pressed="false">прошло</button>
    </div>

    <div class="readout" role="timer" aria-live="off">
      <span class="readout__int" data-f="int">0</span><span class="readout__sep">,</span><span class="readout__dec"><span class="readout__frac" data-f="frac">0000</span><span class="readout__tail" data-f="tail">000</span></span><span class="readout__pct">%</span>
    </div>

    <p class="caption"><span class="dot"></span><span data-f="caption">—</span><span class="caption__next">до <b data-f="np-mark">—</b> · <b class="caption__secs" data-f="np-secs">—</b></span></p>

    <section class="scale" aria-hidden="true">
      <div class="axis" data-f="axis-base"></div>
      <div class="axis axis--lit" data-f="axis-lit"></div>
      <div class="needle" data-f="needle"><span class="needle__flag">сейчас</span></div>
    </section>

    <section class="units">
      <div class="unit"><span class="unit__val" data-f="u-d">0</span><span class="unit__lbl">дней</span></div>
      <div class="unit"><span class="unit__val" data-f="u-h">0</span><span class="unit__lbl">часов</span></div>
      <div class="unit"><span class="unit__val" data-f="u-m">0</span><span class="unit__lbl">минут</span></div>
      <div class="unit"><span class="unit__val" data-f="u-s">0</span><span class="unit__lbl">секунд</span></div>
    </section>

    <footer class="foot">
      <span>точка отсчёта <b data-f="f-start">—</b></span>
      <span>интервал <b data-f="f-total">—</b></span>
      <span>шаг 1/10000 % <b data-f="f-step">—</b></span>
      <span>бледные знаки <b data-f="f-tail">—</b></span>
    </footer>
  </section>
</template>

<script>
  // ── настройки ────────────────────────────────────────────
  // Месяцы в JS считаются с нуля: 6 = июль, 7 = август.
  const START = new Date(2026, 6, 22, 0, 0, 0, 0);   // от чего считаем 100 % — общая точка отсчёта

  const TRACKERS = [
    {
      target: new Date(2026, 7, 22, 0, 0, 0, 0),     // 22 августа 2026, 00:00
      title:  "Трекер · до 22 августа",
      date:   "22 августа 2026",
      span:   "22 июля — 22 августа 2026",
      cls:    ""
    },
    {
      target: new Date(2026, 7, 28, 0, 0, 0, 0),     // 28 августа 2026, 00:00
      title:  "Трекер · до 28 августа",
      date:   "28 августа 2026",
      span:   "22 июля — 28 августа 2026",
      cls:    "tracker--cool"
    }
  ];

  const MONTHS = ["янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
  const nf = new Intl.NumberFormat("ru-RU");
  const nf1 = new Intl.NumberFormat("ru-RU", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const pad = (n, w = 2) => String(n).padStart(w, "0");
  const ru = (n, d) => n.toFixed(d).replace(".", ",");

  // ── шкала: деления по неделям, подписи по месяцам ────────
  function buildAxis(node, target, span) {
    const frag = document.createDocumentFragment();

    for (let t = START.getTime(); t <= target.getTime(); t += 7 * 864e5) {
      const tick = document.createElement("i");
      tick.className = "tick tick--minor";
      tick.style.left = ((t - START) / span * 100) + "%";
      frag.appendChild(tick);
    }

    const cur = new Date(START.getFullYear(), START.getMonth(), 1);
    while (cur <= target) {
      if (cur >= START) {
        const pos = ((cur - START) / span * 100) + "%";
        const tick = document.createElement("i");
        tick.className = "tick tick--major";
        tick.style.left = pos;
        frag.appendChild(tick);

        const label = document.createElement("i");
        label.className = "tlabel";
        label.style.left = pos;
        label.textContent = MONTHS[cur.getMonth()];
        frag.appendChild(label);
      }
      cur.setMonth(cur.getMonth() + 1);
    }

    node.appendChild(frag);
  }

  // ── сборка одного трекера ───────────────────────────────
  const tpl = document.getElementById("tpl-tracker");

  function makeTracker(cfg) {
    const root = tpl.content.firstElementChild.cloneNode(true);
    if (cfg.cls) root.classList.add(cfg.cls);

    const f = {};
    root.querySelectorAll("[data-f]").forEach((n) => { f[n.dataset.f] = n; });

    const TARGET = cfg.target;
    const SPAN = TARGET - START;

    f.title.textContent = cfg.title;
    f.target.textContent = TARGET.toLocaleDateString("ru-RU") + ", 00:00";
    f.modes.setAttribute("aria-label", cfg.title);

    buildAxis(f["axis-base"], TARGET, SPAN);
    buildAxis(f["axis-lit"], TARGET, SPAN);

    // ── подвал ────────────────────────────────────────────
    const totalDays = Math.round(SPAN / 864e5);
    const pctMs = SPAN / 100;                            // один целый процент интервала
    const stepSec = SPAN / 1e6 / 1000;                   // 0,0001 % интервала в секундах
    f["f-start"].textContent = START.toLocaleDateString("ru-RU");
    f["f-total"].textContent = nf.format(totalDays) + " дн · " + nf.format(Math.round(SPAN / 1000)) + " с";
    f["f-step"].textContent = "≈ " + ru(stepSec, 2) + " с";
    f["f-tail"].textContent = "ещё 3 разряда, до " + ru(stepSec / 1000, 3) + " с";

    let mode = "left"; // "left" — осталось, "gone" — прошло

    function setMode(next) {
      mode = next;
      f["m-left"].setAttribute("aria-pressed", String(next === "left"));
      f["m-gone"].setAttribute("aria-pressed", String(next === "gone"));
    }
    f["m-left"].addEventListener("click", () => setMode("left"));
    f["m-gone"].addEventListener("click", () => setMode("gone"));

    // ── тик ───────────────────────────────────────────────
    function render(now) {
      const gone = Math.min(Math.max((now - START) / SPAN, 0), 1);
      const over = now >= TARGET.getTime();

      const share = mode === "left" ? 1 - gone : gone;

      // четыре знака — заявленная точность, ещё три идут «тенью» и меняются покадрово
      const pct = (share * 100).toFixed(7).split(".");
      f.int.textContent = pct[0];
      f.frac.textContent = pct[1].slice(0, 4);
      f.tail.textContent = pct[1].slice(4);

      // стрелка стоит на «сейчас», подсвечена та часть шкалы, которую мы показываем
      const posPct = gone * 100;
      f.needle.style.setProperty("--pos", posPct + "%");
      f["axis-lit"].style.setProperty("--clip-l", (mode === "left" ? posPct : 0) + "%");
      f["axis-lit"].style.setProperty("--clip-r", (mode === "left" ? 0 : 100 - posPct) + "%");

      // единицы: до цели либо от точки отсчёта
      let ms = mode === "left" ? Math.max(TARGET - now, 0) : Math.max(now - START, 0);
      const d = Math.floor(ms / 864e5); ms -= d * 864e5;
      const h = Math.floor(ms / 36e5);  ms -= h * 36e5;
      const m = Math.floor(ms / 6e4);   ms -= m * 6e4;
      f["u-d"].textContent = nf.format(d);
      f["u-h"].textContent = pad(h);
      f["u-m"].textContent = pad(m);
      f["u-s"].textContent = (ms / 1000).toFixed(2).padStart(5, "0").replace(".", ",");

      // до следующего целого процента: момент один и тот же в обоих режимах —
      // gone*100 переходит через целое, — меняется только подпись отметки
      if (over || now <= START.getTime()) {
        f["np-mark"].textContent = "—";
        f["np-secs"].textContent = "—";
      } else {
        const kNext = Math.floor(gone * 100) + 1;
        f["np-mark"].textContent = (mode === "left" ? 100 - kNext : kNext) + " %";
        f["np-secs"].textContent = nf1.format((START.getTime() + kNext * pctMs - now) / 1000) + " с";
      }

      root.classList.toggle("is-over", over);
      f.caption.textContent = over
        ? "срок вышел — " + cfg.date + " наступило"
        : (mode === "left" ? "осталось" : "прошло") + " от интервала " + cfg.span;
    }

    return { root, render };
  }

  const host = document.getElementById("trackers");
  const views = TRACKERS.map(makeTracker);
  views.forEach((v) => host.appendChild(v.root));

  function frame() {
    const now = Date.now();
    for (const v of views) v.render(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
