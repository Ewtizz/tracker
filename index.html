<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>До 22 августа 2026</title>
</head>
<body>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; }

  :root {
    --ground:   #0B0E13;
    --panel:    #121722;
    --rule:     #212936;
    --rule-lit: #2E3949;
    --text:     #E8E3D9;
    --muted:    #8894A6;
    --faint:    #56606F;
    --accent:   #E0904A;
    --accent-d: #8A5326;

    --f-display: "Bahnschrift", "DIN Alternate", "Segoe UI Variable Display", "Segoe UI", Roboto, sans-serif;
    --f-mono: "Cascadia Mono", Consolas, ui-monospace, "SF Mono", Menlo, monospace;
    --f-text: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;

    color-scheme: dark;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --ground:   #EDEFF2;
      --panel:    #FFFFFF;
      --rule:     #D2D8E0;
      --rule-lit: #B9C2CE;
      --text:     #171B22;
      --muted:    #5C6675;
      --faint:    #949DAA;
      --accent:   #A2551F;
      --accent-d: #E4C4A4;
      color-scheme: light;
    }
  }

  :root[data-theme="light"] {
    --ground:   #EDEFF2;
    --panel:    #FFFFFF;
    --rule:     #D2D8E0;
    --rule-lit: #B9C2CE;
    --text:     #171B22;
    --muted:    #5C6675;
    --faint:    #949DAA;
    --accent:   #A2551F;
    --accent-d: #E4C4A4;
    color-scheme: light;
  }

  :root[data-theme="dark"] {
    --ground:   #0B0E13;
    --panel:    #121722;
    --rule:     #212936;
    --rule-lit: #2E3949;
    --text:     #E8E3D9;
    --muted:    #8894A6;
    --faint:    #56606F;
    --accent:   #E0904A;
    --accent-d: #8A5326;
    color-scheme: dark;
  }

  body {
    min-height: 100dvh;
    background: var(--ground);
    color: var(--text);
    font-family: var(--f-text);
    display: grid;
    place-items: center;
    padding: clamp(16px, 4vw, 48px);
    overflow-x: hidden;
  }

  .wrap {
    width: min(980px, 100%);
    display: flex;
    flex-direction: column;
    gap: clamp(28px, 5vw, 52px);
  }

  /* ── шапка ─────────────────────────────────────────────── */
  .head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px 24px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--rule);
  }
  .head__title {
    font-family: var(--f-display);
    font-variation-settings: "wght" 600, "wdth" 87.5;
    font-weight: 600;
    font-size: 0.82rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin: 0;
  }
  .head__target {
    font-family: var(--f-mono);
    font-size: 0.76rem;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  .head__target b { color: var(--text); font-weight: 400; }

  /* ── переключатель режима ──────────────────────────────── */
  .modes { display: flex; gap: 22px; }
  .mode {
    font-family: var(--f-display);
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--faint);
    padding: 4px 0 6px;
    border-bottom: 1px solid transparent;
    cursor: pointer;
    transition: color .18s ease, border-color .18s ease;
  }
  .mode:hover { color: var(--muted); }
  .mode[aria-pressed="true"] { color: var(--text); border-bottom-color: var(--accent); }
  .mode:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }

  /* ── главный отсчёт ────────────────────────────────────── */
  .readout {
    position: relative;
    display: flex;
    align-items: baseline;
    gap: 0;
    font-family: var(--f-display);
    font-variation-settings: "wght" 300, "wdth" 87.5;
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    font-size: clamp(3.6rem, 16vw, 10.5rem);
    line-height: 0.86;
    letter-spacing: -0.02em;
    margin-top: clamp(10px, 3vw, 26px);
  }
  .readout::before {
    content: "";
    position: absolute;
    left: -8%; top: -60%;
    width: 70%; height: 260%;
    background: radial-gradient(ellipse at 30% 50%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 62%);
    pointer-events: none;
    z-index: -1;
  }
  .readout__int { }
  .readout__sep { color: var(--muted); }
  .readout__dec {
    display: flex;
    align-items: baseline;
    font-family: var(--f-mono);
    font-size: 0.34em;
    font-weight: 400;
    letter-spacing: 0.01em;
    align-self: flex-end;
    padding-bottom: 0.28em;
  }
  .readout__frac { color: var(--accent); }
  .readout__tail {
    font-size: 0.62em;
    color: var(--faint);
    letter-spacing: 0.02em;
    padding-left: 0.12em;
  }
  .readout__pct {
    font-size: 0.24em;
    color: var(--muted);
    align-self: flex-end;
    padding: 0 0 0.45em 0.5em;
    letter-spacing: 0.06em;
  }
  .caption {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 18px;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .caption .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  /* ── шкала интервала ───────────────────────────────────── */
  .scale {
    position: relative;
    height: 68px;
    border-top: 1px solid var(--rule);
    padding-top: 1px;
  }
  .axis { position: absolute; inset: 0; }
  .axis--lit { clip-path: inset(0 var(--clip-r, 0%) 0 var(--clip-l, 0%)); }
  .tick {
    position: absolute;
    top: 0;
    width: 1px;
    background: var(--rule-lit);
    transform: translateX(-0.5px);
  }
  .tick--minor { height: 7px; }
  .tick--major { height: 17px; background: var(--faint); }
  .axis--lit .tick { background: var(--accent); }
  .axis--lit .tick--minor { background: color-mix(in srgb, var(--accent) 55%, transparent); }
  .tlabel {
    position: absolute;
    top: 24px;
    transform: translateX(-50%);
    font-family: var(--f-mono);
    font-size: 0.66rem;
    letter-spacing: 0.08em;
    color: var(--faint);
    white-space: nowrap;
  }
  .axis--lit .tlabel { color: var(--accent); }

  .needle {
    position: absolute;
    top: -6px; bottom: 8px;
    left: var(--pos, 0%);
    width: 1px;
    background: var(--text);
    transform: translateX(-0.5px);
    z-index: 2;
  }
  .needle::before {
    content: "";
    position: absolute;
    top: -3px; left: -2.5px;
    width: 6px; height: 6px;
    background: var(--text);
    transform: rotate(45deg);
  }
  .needle__flag {
    position: absolute;
    bottom: -2px; left: 7px;
    font-family: var(--f-mono);
    font-size: 0.64rem;
    letter-spacing: 0.1em;
    color: var(--text);
    white-space: nowrap;
  }

  /* ── единицы ───────────────────────────────────────────── */
  .units {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-top: 1px solid var(--rule);
  }
  .unit {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 18px 0 0 16px;
    border-left: 1px solid var(--rule);
  }
  .unit:first-child { padding-left: 0; border-left: 0; }
  .unit__val {
    font-family: var(--f-mono);
    font-variant-numeric: tabular-nums;
    font-size: clamp(1.15rem, 3.4vw, 1.9rem);
    line-height: 1;
  }
  .unit__lbl {
    font-family: var(--f-display);
    font-size: 0.62rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ── подвал ────────────────────────────────────────────── */
  .foot {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 28px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
    font-family: var(--f-mono);
    font-size: 0.68rem;
    letter-spacing: 0.03em;
    color: var(--faint);
  }
  .foot span b { color: var(--muted); font-weight: 400; }

  body.is-over .caption .dot { animation: none; background: var(--muted); }

  @media (max-width: 560px) {
    .units { grid-template-columns: repeat(2, 1fr); }
    .unit:nth-child(3) { padding-left: 0; border-left: 0; }
    .unit:nth-child(n+3) { padding-top: 22px; }
    .needle__flag { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .caption .dot { animation: none; }
    .mode { transition: none; }
  }
</style>

<div class="wrap">
  <header class="head">
    <h1 class="head__title">Трекер · до 22 августа</h1>
    <div class="head__target">цель — <b>22.08.2026, 00:00</b> · местное время</div>
  </header>

  <main>
    <div class="modes">
      <button class="mode" id="m-left" aria-pressed="true">осталось</button>
      <button class="mode" id="m-gone" aria-pressed="false">прошло</button>
    </div>

    <div class="readout" role="timer" aria-live="off">
      <span class="readout__int" id="int">0</span><span class="readout__sep">,</span><span class="readout__dec"><span class="readout__frac" id="frac">0000</span><span class="readout__tail" id="tail">000</span></span><span class="readout__pct">%</span>
    </div>

    <p class="caption"><span class="dot"></span><span id="caption">от интервала 1 января — 22 августа 2026</span></p>
  </main>

  <section class="scale" aria-hidden="true">
    <div class="axis" id="axis-base"></div>
    <div class="axis axis--lit" id="axis-lit"></div>
    <div class="needle" id="needle"><span class="needle__flag">сейчас</span></div>
  </section>

  <section class="units">
    <div class="unit"><span class="unit__val" id="u-d">0</span><span class="unit__lbl">дней</span></div>
    <div class="unit"><span class="unit__val" id="u-h">0</span><span class="unit__lbl">часов</span></div>
    <div class="unit"><span class="unit__val" id="u-m">0</span><span class="unit__lbl">минут</span></div>
    <div class="unit"><span class="unit__val" id="u-s">0</span><span class="unit__lbl">секунд</span></div>
  </section>

  <footer class="foot">
    <span>точка отсчёта <b id="f-start">01.01.2026</b></span>
    <span>интервал <b id="f-total">—</b></span>
    <span>шаг 1/10000 % <b id="f-step">—</b></span>
    <span>бледные знаки <b id="f-tail">—</b></span>
  </footer>
</div>

<script>
  // ── настройки ────────────────────────────────────────────
  // Месяцы в JS считаются с нуля: 7 = август, 0 = январь.
  const TARGET = new Date(2026, 7, 22, 0, 0, 0, 0);   // 22 августа 2026, 00:00
  const START  = new Date(2026, 6, 22,  0, 0, 0, 0);   // от чего считаем 100 %

  const SPAN = TARGET - START;
  const MONTHS = ["янв", "фев", "мар", "апр", "май", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"];
  const nf = new Intl.NumberFormat("ru-RU");

  const el = (id) => document.getElementById(id);
  const intEl = el("int"), fracEl = el("frac"), tailEl = el("tail"), capEl = el("caption");
  const needle = el("needle"), axisLit = el("axis-lit");
  const uD = el("u-d"), uH = el("u-h"), uM = el("u-m"), uS = el("u-s");

  let mode = "left"; // "left" — осталось, "gone" — прошло

  // ── шкала: деления по неделям, подписи по месяцам ────────
  function buildAxis(node) {
    const frag = document.createDocumentFragment();

    for (let t = START.getTime(); t <= TARGET.getTime(); t += 7 * 864e5) {
      const tick = document.createElement("i");
      tick.className = "tick tick--minor";
      tick.style.left = ((t - START) / SPAN * 100) + "%";
      frag.appendChild(tick);
    }

    const cur = new Date(START.getFullYear(), START.getMonth(), 1);
    while (cur <= TARGET) {
      if (cur >= START) {
        const pos = ((cur - START) / SPAN * 100) + "%";
        const tick = document.createElement("i");
        tick.className = "tick tick--major";
        tick.style.left = pos;
        frag.appendChild(tick);

        const label = document.createElement("i");
        label.className = "tlabel";
        label.style.left = pos;
        label.textContent = MONTHS[cur.getMonth()];
        frag.appendChild(label);
      }
      cur.setMonth(cur.getMonth() + 1);
    }

    node.appendChild(frag);
  }
  buildAxis(el("axis-base"));
  buildAxis(axisLit);

  // ── подвал ──────────────────────────────────────────────
  const totalDays = Math.round(SPAN / 864e5);
  el("f-start").textContent = START.toLocaleDateString("ru-RU");
  el("f-total").textContent = nf.format(totalDays) + " дн · " + nf.format(Math.round(SPAN / 1000)) + " с";
  const stepSec = SPAN / 1e6 / 1000;                     // 0,0001 % интервала в секундах
  const ru = (n, d) => n.toFixed(d).replace(".", ",");
  el("f-step").textContent = "≈ " + ru(stepSec, 2) + " с";
  el("f-tail").textContent = "ещё 3 разряда, до " + ru(stepSec / 1000, 3) + " с";

  // ── тик ─────────────────────────────────────────────────
  const pad = (n, w = 2) => String(n).padStart(w, "0");

  function frame() {
    const now = Date.now();
    const gone = Math.min(Math.max((now - START) / SPAN, 0), 1);
    const over = now >= TARGET.getTime();

    const share = mode === "left" ? 1 - gone : gone;

    // четыре знака — заявленная точность, ещё три идут «тенью» и меняются покадрово
    const pct = (share * 100).toFixed(7).split(".");
    intEl.textContent = pct[0];
    fracEl.textContent = pct[1].slice(0, 4);
    tailEl.textContent = pct[1].slice(4);

    // стрелка стоит на «сейчас», подсвечена та часть шкалы, которую мы показываем
    const posPct = gone * 100;
    needle.style.setProperty("--pos", posPct + "%");
    axisLit.style.setProperty("--clip-l", (mode === "left" ? posPct : 0) + "%");
    axisLit.style.setProperty("--clip-r", (mode === "left" ? 0 : 100 - posPct) + "%");

    // единицы: до цели либо от точки отсчёта
    let ms = mode === "left" ? Math.max(TARGET - now, 0) : Math.max(now - START, 0);
    const d = Math.floor(ms / 864e5); ms -= d * 864e5;
    const h = Math.floor(ms / 36e5);  ms -= h * 36e5;
    const m = Math.floor(ms / 6e4);   ms -= m * 6e4;
    uD.textContent = nf.format(d);
    uH.textContent = pad(h);
    uM.textContent = pad(m);
    uS.textContent = (ms / 1000).toFixed(2).padStart(5, "0").replace(".", ",");

    document.body.classList.toggle("is-over", over);
    capEl.textContent = over
      ? "срок вышел — 22 августа 2026 наступило"
      : (mode === "left" ? "осталось" : "прошло") + " от интервала 22 июля — 22 августа 2026";

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ── переключатель ───────────────────────────────────────
  function setMode(next) {
    mode = next;
    el("m-left").setAttribute("aria-pressed", String(next === "left"));
    el("m-gone").setAttribute("aria-pressed", String(next === "gone"));
  }
  el("m-left").addEventListener("click", () => setMode("left"));
  el("m-gone").addEventListener("click", () => setMode("gone"));
</script>
</body>
</html>
